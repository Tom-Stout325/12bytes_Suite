{% extends "index.html" %}

{% block title %}Delete Recurring Expense | MoneyPro{% endblock %}

{% block content %}
<div class="container-fluid px-2 px-md-3 py-3">
  <div class="card shadow-sm border-danger">
    <div class="card-header bg-danger text-white">
      <h1 class="h5 mb-0">Delete Recurring Expense</h1>
    </div>
    <div class="card-body">
      <p class="mb-3">Delete <strong>{{ object.name }}</strong>?</p>
      <p class="text-muted small">Existing transactions created from this recurring expense will not be deleted.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="{% url 'ledger:recurring_expense_list' %}">Cancel</a>
          <button class="btn btn-danger" type="submit">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
